services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["${MEDIARY_PORT:-8088}:80"]
    depends_on: [api,live]
  api:
    build: ./backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-mediary_local}
    depends_on:
      db: {condition: service_healthy}
      kafka: {condition: service_started}
    volumes: [media:/media]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
  notifications:
    build: ./backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-mediary_local}
      NOTIFICATIONS_WORKER: "true"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_SQL_INIT_MODE: never
    depends_on:
      api: {condition: service_healthy}
      kafka: {condition: service_started}
  processor:
    build: ./backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-mediary_local}
      SPRING_SQL_INIT_MODE: never
      MEDIA_WORKER: "true"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    volumes: [media:/media]
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mediary
      POSTGRES_DB: mediary
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediary_local}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mediary"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [events:/var/lib/kafka/data]
  live:
    image: bluenviron/mediamtx:1.12.3
    ports: ["1935:1935"]
    environment:
      MTX_AUTHMETHOD: http
      MTX_AUTHHTTPADDRESS: http://api:8080/internal/live-auth
volumes:
  media:
  postgres:
  events:
